buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'com.github.johnrengelman:shadow:8.1.1'
    }
}

apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'com.github.johnrengelman.shadow'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

mainClassName = 'com.leonardo.impulsojob.Main'

application {
    mainClass = 'com.leonardo.impulsojob.Main'
}

tasks.withType(JavaExec) {
    jvmArgs += ['-Dfile.encoding=UTF-8']
}

tasks.withType(Test) {
    jvmArgs += ['-Dfile.encoding=UTF-8']
    useJUnitPlatform()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.itextpdf:itext7-core:8.0.2'
    implementation 'com.formdev:flatlaf:3.5.2'
    implementation group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
    implementation 'org.postgresql:postgresql:42.7.1'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Configuração do Shadow JAR (Fat JAR executável com todas as dependências)
shadowJar {
    archiveFileName = 'ImpulsoJob.jar'

    manifest {
        attributes(
            'Main-Class': 'com.leonardo.impulsojob.Main',
            'Implementation-Title': 'ImpulsoJob',
            'Implementation-Version': '1.0'
        )
    }

    mergeServiceFiles()

    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
}

// Redireciona a tarefa jar padrão para o shadowJar
jar {
    enabled = false
    dependsOn shadowJar
}

assemble.dependsOn shadowJar
build.dependsOn shadowJar
